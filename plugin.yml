# No deps block: the plugin binary embeds the harness-cli version pinned in
# HC_VERSION and unpacks it on first use, so there is nothing to install here.
# That also means this works on macOS and Windows runners, which a shell-based
# deps step did not.
run:
  binary:
    source: https://github.com/harness/drone-har/releases/download/{{ release }}/plugin-{{ os }}-{{ arch }}.zst
